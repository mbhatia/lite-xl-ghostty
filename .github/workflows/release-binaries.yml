name: release-binaries

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

env:
  LPM_ARCH: aarch64-darwin
  GHOSTTY_REPOSITORY: "https://github.com/manaflow-ai/ghostty.git"
  GHOSTTY_REF: "xcframework-6b8d558cea313b09c10ac107254d6ee41a5044d9"
  GHOSTTY_COMMIT: "41ab6c5ab650465dd65c9957ae0a95225e2c1048"
  ZIG_VERSION: "0.15.2"

jobs:
  aarch64-darwin:
    name: Build ghostty_lxl for aarch64-darwin
    runs-on: macos-15

    steps:
      - name: Check out lite-xl-ghostty
        uses: actions/checkout@v4

      - name: Verify native arm64 runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          xcode-select --print-path

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install build tools
        run: brew install cmake ninja gettext

      - name: Fetch pinned Ghostty source
        run: |
          set -euo pipefail
          rm -rf references/ghostty
          git clone --depth 1 --branch "${GHOSTTY_REF}" \
            "${GHOSTTY_REPOSITORY}" references/ghostty
          test "$(git -C references/ghostty rev-parse HEAD)" = "${GHOSTTY_COMMIT}"
          test -f references/ghostty/CMakeLists.txt

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLXL_GHOSTTY_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Stage release asset
        run: |
          set -euo pipefail
          mkdir -p dist
          cp libraries/ghostty_lxl/init.lib "dist/ghostty_lxl.${LPM_ARCH}.lib"
          file "dist/ghostty_lxl.${LPM_ARCH}.lib"
          lipo -archs "dist/ghostty_lxl.${LPM_ARCH}.lib" | grep -qw arm64
          shasum -a 256 "dist/ghostty_lxl.${LPM_ARCH}.lib" \
            | tee "dist/ghostty_lxl.${LPM_ARCH}.lib.sha256"
          {
            echo "### ${LPM_ARCH} release asset"
            echo
            echo "\`\`\`"
            cat "dist/ghostty_lxl.${LPM_ARCH}.lib.sha256"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostty_lxl-${{ env.LPM_ARCH }}
          path: dist/*
          if-no-files-found: error

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
